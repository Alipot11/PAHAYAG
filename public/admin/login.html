<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#0f172a">
  <title>Admin Login | PAHAYAG</title>
  <link rel="icon" type="image/x-icon" href="assets/tourism-logo.ico">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=Space+Mono&family=Permanent+Marker&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <header id="site-header" class="nav"></header>

  <div class="pagehead"><div class="wrap"><h1>Admin login</h1></div></div>

  <section class="section section--soft">
    <div class="wrap">
      <div class="reg-layout reg-layout--login">

        <div>
          <form id="login-form" class="form" novalidate>
            <div class="field">
              <label for="password">Password</label>
              <input id="password" type="password" autocomplete="current-password" required>
            </div>
            <button type="submit" class="btn btn--navy">Log in</button>
          </form>
          <div id="msg" class="msg" hidden></div>
        </div>

        <figure class="reg-photo">
          <img src="/img/admin-login.jpg" alt="PAHAYAG event">
          <figcaption>PAHAYAG Staff</figcaption>
        </figure>

      </div>
    </div>
  </section>

  <footer id="site-footer" class="footer"></footer>
  <script src="/js/layout.js"></script>
  <script src="/js/admin-login.js"></script>
</body>
</html>
