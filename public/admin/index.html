<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#0f172a">
  <title>Admin | PAHAYAG</title>
  <link rel="icon" type="image/x-icon" href="assets/tourism-logo.ico">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=Space+Mono&family=Permanent+Marker&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <header id="site-header" class="nav"></header>

  <div class="pagehead">
    <div class="wrap">
      <h1>Admin</h1>
      <p>
        <a class="btn btn--outline" href="/admin/registrations">View registrations</a>
        <button id="logout" class="btn btn--outline" type="button">Log out</button>
      </p>
    </div>
  </div>

  <section class="section section--soft">
    <div class="wrap">
      <h2>Post an announcement</h2>
      <form id="post-form" class="form" novalidate>
        <div class="field">
          <label for="title">Title</label>
          <input id="title" type="text" maxlength="150" required>
        </div>
        <div class="field">
          <label for="body">Message</label>
          <textarea id="body" rows="6" maxlength="5000" required></textarea>
        </div>
        <button type="submit" class="btn btn--navy">Post announcement</button>
      </form>
      <div id="msg" class="msg" hidden></div>
    </div>
  </section>

  <section class="section">
    <div class="wrap">
      <h2>Posted announcements</h2>
      <div id="posts"><p>Loading…</p></div>
    </div>
  </section>

  <footer id="site-footer" class="footer"></footer>
  <script src="/js/layout.js"></script>
  <script src="/js/admin.js"></script>
</body>
</html>
